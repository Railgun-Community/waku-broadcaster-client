packages:
  - packages/*
# GHSA-w5hq-g745-h8pq: uuid@9 inside @waku/core; patched only in uuid >=11.1.1.
# Forcing a two-major bump inside the Waku transport is riskier than the advisory
# (insufficiently random UUIDs; not used for key material here). Revisit on @waku/sdk upgrade.
auditConfig:
  ignoreGhsas:
    - GHSA-w5hq-g745-h8pq
allowBuilds:
  bufferutil: false
  utf-8-validate: false
